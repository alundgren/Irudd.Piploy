name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        run: pnpm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Scan dependencies
        run: |
          set -o pipefail
          pnpm audit --prod --json | tee pnpm-audit.json
          test "$(jq '[.metadata.vulnerabilities | to_entries[] | select(.key != "info") | .value] | add' pnpm-audit.json)" -eq 0

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - name: Create release and attach the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/piploy.cjs sbom.cdx.json pnpm-audit.json --title "${{ github.ref_name }}" --generate-notes
